name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_dev_password
          POSTGRES_DB: fintech_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fintech -d fintech_core"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      MPESA_TOKEN_URL: ${{ secrets.MPESA_TOKEN_URL }}
      MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
      MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
      MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
      MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
      MPESA_STK_URL: ${{ secrets.MPESA_STK_URL }}
      MPESA_CALLBACK_URL: ${{ secrets.MPESA_CALLBACK_URL }}
      MPESA_SETTLEMENT_ACCOUNT_ID: ${{ secrets.MPESA_SETTLEMENT_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --runInBand --detectOpenHandles

      - name: Build app
        run: npm run build
